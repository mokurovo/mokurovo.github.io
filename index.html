  <svg class="svg-filters" aria-hidden="true" focusable="false">
    <filter id="liquid-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="9" result="noise">
        <animate attributeName="baseFrequency" values="0.012 0.02;0.018 0.014;0.012 0.02" dur="2.4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="pearl-text-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="softGlow" />
      <feFlood flood-color="#fff3df" flood-opacity="0.28" result="warmLight" />
      <feComposite in="warmLight" in2="softGlow" operator="in" result="warmBloom" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="wideGlow" />
      <feFlood flood-color="#efd9b6" flood-opacity="0.10" result="wideLight" />
      <feComposite in="wideLight" in2="wideGlow" operator="in" result="wideBloom" />
      <feMerge>
        <feMergeNode in="wideBloom" />
        <feMergeNode in="warmBloom" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </svg>
