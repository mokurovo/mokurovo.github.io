name: Temporary Round14 deployment
on:
  push:
    branches: [deploy-round14-staging]
    paths: ['.deploy/ready']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify complete source
        run: python3 .deploy/assemble.py
      - name: Publish verified source to main
        env:
          GIT_AUTHOR_NAME: mokurovo
          GIT_AUTHOR_EMAIL: 2939293281@qq.com
          GIT_COMMITTER_NAME: mokurovo
          GIT_COMMITTER_EMAIL: 2939293281@qq.com
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7abf38e26f6375c642941ce698bbccf4f0cad4a6"
          export GIT_INDEX_FILE="$RUNNER_TEMP/round14-index"
          git read-tree --empty
          python3 -c 'import json,subprocess; subprocess.run(["git","add","--"]+[f["path"] for f in json.load(open(".deploy/manifest.json"))],check=True)'
          tree=$(git write-tree)
          commit=$(echo "Deploy verified portfolio V0.6 Round14" | git commit-tree "$tree" -p origin/main)
          git push origin "$commit:refs/heads/main"
          echo "Published source commit: $commit"
      - name: Remove temporary deployment branch and workflow
        run: git push origin --delete deploy-round14-staging
